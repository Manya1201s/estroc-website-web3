    <link rel="canonical" href="https://estroc.co.in/" />
    <meta name="theme-color" content="#0a0a0b" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ESTROC" />
    <meta property="og:url" content="https://estroc.co.in/" />

    <meta property="og:image:alt" content="ESTROC — We Build What Comes Next" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ESTROC — We Build What Comes Next" />
    <meta name="twitter:description" content="A technology studio building digital products, custom software and AI solutions for businesses, startups and founders." />
    <meta name="twitter:image" content="https://estroc.co.in/og.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "ESTROC",
        "url": "https://estroc.co.in/",
        "logo": "https://estroc.co.in/favicon.svg",
        "image": "https://estroc.co.in/og.png",
        "description": "ESTROC builds digital products, custom software and AI-powered solutions for businesses, startups and founders.",
        "email": "hello@estroc.co.in",
        "slogan": "We Build What Comes Next",
        "knowsAbout": ["Web Development", "Mobile Apps", "SaaS", "Custom Software", "CRM", "AI Solutions", "Workflow Automation", "Blockchain"]
      }
    </script>
    <title>ESTROC — We Build What Comes Next</title>
    <script>
      (() => {
        const savedTheme = localStorage.getItem("estroc-theme");
        const theme = savedTheme === "light" || savedTheme === "dark"
          ? savedTheme
          : matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.classList.remove("dark", "light");
        document.documentElement.classList.add(theme);
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
