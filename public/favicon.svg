<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- The ESTROC E: three bars, the middle one carrying the orange signal. The
       dark plate keeps it legible on both light and dark browser tabs. -->
  <rect width="32" height="32" rx="7" fill="#0a0a0b"/>
  <rect x="7" y="8" width="18" height="4" fill="#f5f5f7"/>
  <rect x="7" y="14" width="12" height="4" fill="#ff5500"/>
  <rect x="7" y="20" width="18" height="4" fill="#f5f5f7"/>
</svg>
